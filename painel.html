<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo - Campeonato de Sinuca</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #10b981;
            --accent-blue: #0ea5e9;
            --accent-orange: #ff3c00;
            --accent-red: #ef4444;
            --text-color: #e0e0e0;
            --text-muted: #9ca3af;
            --border-color: #2d2d2d;
        }

        /* Barra de rolagem ultrafina (3px) e elegante */
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 1px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }

        /* Barra de rolagem ultrafina para Firefox */
        * { 
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) var(--bg-color);
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', sans-serif; 
        }

        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }
        
        header { text-align: center; margin-bottom: 20px; padding: 15px; background: var(--card-bg); border-radius: 12px; border-bottom: 4px solid var(--accent-green); }
        h1 { color: #fff; font-size: 1.5rem; margin-bottom: 5px; }
        
        .controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        select, button, input[type="text"] { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
        input[type="text"] { cursor: text; width: 100%; max-width: 200px; }
        input[type="text"]::placeholder { color: var(--text-muted); }
        
        button.btn-main { background: var(--accent-green); color: #fff; font-weight: 600; border: none; }
        button.btn-config { background: #3b82f6; color: #fff; font-weight: 600; border: none; }
        button:hover { opacity: 0.9; }

        /* Legenda de Cores Rápidas */
        .legend-container { display: flex; gap: 15px; justify-content: center; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        .container { max-width: 950px; margin: 0 auto; display: grid; gap: 15px; }
        .matchday-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid var(--border-color); }
        .matchday-title { font-size: 1.1rem; color: var(--accent-orange); margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        
        .matches-grid { display: grid; gap: 10px; }
        .match-item { background: #161616; padding: 10px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border-color); transition: all 0.2s ease; }
        
        /* ESTADOS DOS CONFRONTOS */
        .match-item.status-verde { border-color: var(--accent-green); background-color: rgba(16, 185, 129, 0.04); }
        .match-item.status-verde .score-display { border-color: var(--accent-green); color: var(--accent-green); }

        .match-item.status-azul { border-color: var(--accent-blue); background-color: rgba(14, 165, 233, 0.04); }
        .match-item.status-azul .match-header-info { color: var(--accent-blue); font-weight: bold; }
        .match-item.status-azul .score-display { border-color: var(--accent-blue); color: var(--accent-blue); }

        .match-item.status-vermelho { border-color: var(--accent-red); background-color: rgba(239, 68, 68, 0.08); }
        .match-item.status-vermelho .match-header-info { color: var(--accent-red); font-weight: bold; }
        .match-item.status-vermelho .score-display { border-color: var(--accent-red); color: var(--accent-red); }

        .match-header-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); border-bottom: 1px solid #222; padding-bottom: 4px; }
        
        .match-teams { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; }
        
        .team-name { font-size: 0.85rem; font-weight: 600; flex: 1; word-break: break-word; }
        .team-name.home { text-align: right; }
        .team-name.away { text-align: left; }

        .score-control-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        
        .btn-score { background: #2a2a2a; color: #fff; border: 1px solid var(--border-color); width: 32px; height: 32px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .btn-score:hover { background: var(--accent-orange); border-color: var(--accent-orange); }
        
        .score-display { background: #111; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; font-size: 1rem; font-weight: bold; color: var(--text-color); min-width: 36px; text-align: center; }

        .save-bar { position: fixed; bottom: 15px; right: 15px; background: var(--accent-green); color: #fff; padding: 12px 20px; border-radius: 50px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; z-index: 1000; border: none; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }

        @media (max-width: 600px) {
            body { padding: 8px; }
            header { padding: 12px; margin-bottom: 15px; }
            h1 { font-size: 1.3rem; }
            .controls { flex-direction: column; width: 100%; gap: 8px; }
            .controls select, .controls input[type="text"], .controls button { width: 100%; max-width: 100%; display: block; text-align: center; }
            .team-name { font-size: 0.8rem; }
            .score-display { min-width: 32px; padding: 4px 6px; font-size: 0.9rem; }
            .btn-score { width: 30px; height: 30px; font-size: 0.9rem; }
            .save-bar { bottom: 10px; right: 10px; left: 10px; justify-content: center; border-radius: 12px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🛠️ Painel Administrativo</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Sincronizado diretamente com o GitHub</p>
    </header>

    <div class="controls">
        <select id="filterRodada" onchange="renderAdminMatches()">
            <option value="all">Todas as Rodadas</option>
        </select>
        
        <input type="text" id="searchJogador" placeholder="🔍 Pesquisar jogador..." oninput="renderAdminMatches()">

        <button onclick="carregarDados()" style="background: var(--accent-orange); color:#fff; border:none;">🔄 Atualizar Dados</button>

        <button class="btn-config" onclick="configurarGitHub()">⚙️ Configurar GitHub</button>
        <button class="btn-main" onclick="salvarNoGitHub()">☁️ Salvar na Nuvem</button>
    </div>

    <!-- Legenda de Cores -->
    <div class="legend-container">
        <div class="legend-item"><span class="legend-dot" style="background: var(--accent-green);"></span> Jogo Realizado / Andamento</div>
        <div class="legend-item"><span class="legend-dot" style="background: var(--accent-blue);"></span> Jogo Adiantado (Placar lançado antes da hora)</div>
        <div class="legend-item"><span class="legend-dot" style="background: var(--accent-red);"></span> Jogo Atrasado</div>
    </div>

    <div class="container" id="adminContainer" style="padding-bottom: 60px;">
        <div style="text-align:center; padding:40px;">A carregar dados... Clica em "Atualizar Dados" se necessário.</div>
    </div>

    <button class="save-bar" onclick="salvarNoGitHub()">☁️ Salvar Alterações na Nuvem</button>

<script>
    const jogadores = {
        1: "Josué", 2: "Dirciano", 3: "Léo", 4: "Rafael", 5: "Bill",
        6: "Fernando", 7: "Marq. Bananal", 8: "Denis", 9: "Gerson", 10: "Tiago",
        11: "Tiradentes", 12: "Zeca", 13: "Walmir", 14: "Deí", 15: "Rodrigo MT",
        16: "Luciano", 17: "Marquinho", 18: "Gabriel", 19: "Juninho", 20: "Tarcísio",
        21: "Mateus", 22: "Samuel", 23: "Lorinho", 24: "Marcos"
    };

    let campeonatoData = [];

    function configurarGitHub() {
        const ownerAtual = localStorage.getItem('gh_owner') || 'sinucabrasileira';
        const repoAtual = localStorage.getItem('gh_repo') || 'home';
        const tokenAtual = localStorage.getItem('gh_token') || '';

        const owner = prompt("Insere o teu utilizador ou organização do GitHub:", ownerAtual);
        if (!owner) return;
        const repo = prompt("Insere o nome do repositório:", repoAtual);
        if (!repo) return;
        const token = prompt("Insere o teu Personal Access Token do GitHub:", tokenAtual);
        if (!token) return;

        localStorage.setItem('gh_owner', owner.trim());
        localStorage.setItem('gh_repo', repo.trim());
        localStorage.setItem('gh_token', token.trim());
        alert("Configurações do GitHub guardadas com sucesso!");
        carregarDados();
    }

    async function carregarDados() {
        try {
            const response = await fetch('placar.json?t=' + new Date().getTime(), {
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            });
            if (!response.ok) throw new Error("Ficheiro placar.json não encontrado.");
            campeonatoData = await response.json();
            popularFiltro();
            renderAdminMatches();
            alert("Dados atualizados com sucesso!");
        } catch (error) {
            document.getElementById('adminContainer').innerHTML = `
                <div class="matchday-card" style="text-align: center; color: var(--accent-red);">
                    <h3>⚠️ Erro ao carregar placar.json</h3>
                    <p style="color: var(--text-muted); margin-top: 10px;">Certifica-te de que o ficheiro <code>placar.json</code> está na mesma pasta.</p>
                </div>`;
        }
    }

    async function salvarNoGitHub() {
        const owner = localStorage.getItem('gh_owner');
        const repo = localStorage.getItem('gh_repo');
        const token = localStorage.getItem('gh_token');

        if (!owner || !repo || !token) {
            alert("Por favor, configura primeiro as credenciais do GitHub clicando em '⚙️ Configurar GitHub'.");
            configurarGitHub();
            return;
        }

        const url = `https://api.github.com/repos/${owner}/${repo}/contents/placar.json`;

        try {
            const getRes = await fetch(url, {
                headers: { "Authorization": `token ${token}` },
                cache: 'no-store'
            });
            if (!getRes.ok) throw new Error("Não foi possível obter o ficheiro do repositório. Verifica as tuas credenciais.");
            const fileData = await getRes.json();
            const sha = fileData.sha;

            const jsonString = JSON.stringify(campeonatoData, null, 2);
            const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

            const putRes = await fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    message: "Atualização de placar via Painel Admin [Automático]",
                    content: contentBase64,
                    sha: sha
                })
            });

            if (putRes.ok) {
                alert("Placar guardado e sincronizado com o GitHub com sucesso! 🚀");
            } else {
                throw new Error("Falha ao gravar no GitHub.");
            }
        } catch (err) {
            console.error(err);
            alert("Erro ao sincronizar com o GitHub: " + err.message);
        }
    }

    function popularFiltro() {
        const select = document.getElementById('filterRodada');
        const rodadasUnicas = [...new Set(campeonatoData.map(item => item.rodada))];
        const valorAtual = select.value;
        
        select.innerHTML = '<option value="all">Todas as Rodadas</option>';
        rodadasUnicas.forEach(r => {
            select.innerHTML += `<option value="${r}">Rodada ${r}</option>`;
        });
        select.value = valorAtual;
    }

    function parseMatchDateTime(dataStr, horarioStr) {
        if (!dataStr || !horarioStr) return new Date(0);
        const partesData = dataStr.split('/');
        if (partesData.length < 2) return new Date(0);
        const dia = parseInt(partesData[0], 10);
        const mes = parseInt(partesData[1], 10);
        
        const partesHora = horarioStr.split(':');
        const horas = partesHora.length > 0 ? parseInt(partesHora[0], 10) : 0;
        const minutos = partesHora.length > 1 ? parseInt(partesHora[1], 10) : 0;
        
        let ano = 2026;
        if (mes < 10) ano = 2027;
        
        return new Date(ano, mes - 1, dia, horas, minutos);
    }

    function alterarPlacar(indexGlobal, time, valor) {
        if (time === 1) {
            campeonatoData[indexGlobal].g1 = Math.max(0, campeonatoData[indexGlobal].g1 + valor);
        } else {
            campeonatoData[indexGlobal].g2 = Math.max(0, campeonatoData[indexGlobal].g2 + valor);
        }
        renderAdminMatches();
    }

    function renderAdminMatches() {
        const container = document.getElementById('adminContainer');
        const filtroRodada = document.getElementById('filterRodada').value;
        const termoBusca = document.getElementById('searchJogador').value.toLowerCase().trim();
        container.innerHTML = '';

        const agora = new Date();
        const grupos = {};
        
        campeonatoData.forEach((m, indexGlobal) => {
            const p1Nome = (jogadores[m.p1] || `Jogador ${m.p1}`).toLowerCase();
            const p2Nome = (jogadores[m.p2] || `Jogador ${m.p2}`).toLowerCase();

            const atendeRodada = (filtroRodada === 'all' || m.rodada == filtroRodada);
            const atendeBusca = (!termoBusca || p1Nome.includes(termoBusca) || p2Nome.includes(termoBusca));

            if (atendeRodada && atendeBusca) {
                const key = `Rodada ${m.rodada} - ${m.dia} (${m.data})`;
                if (!grupos[key]) grupos[key] = [];
                grupos[key].push({ match: m, originalIndex: indexGlobal });
            }
        });

        if (Object.keys(grupos).length === 0) {
            container.innerHTML = `<div class="matchday-card" style="text-align:center; color:var(--text-muted);">Nenhum jogo encontrado para os filtros selecionados.</div>`;
            return;
        }

        for (let [key, items] of Object.entries(grupos)) {
            let cardHtml = `
                <div class="matchday-card">
                    <div class="matchday-title">📅 ${key}</div>
                    <div class="matches-grid">
            `;

            items.forEach(item => {
                const m = item.match;
                const idx = item.originalIndex;

                const p1Nome = jogadores[m.p1] || `Jogador ${m.p1}`;
                const p2Nome = jogadores[m.p2] || `Jogador ${m.p2}`;

                const matchDate = parseMatchDateTime(m.data, m.horario);
                const g1 = Number(m.g1) || 0;
                const g2 = Number(m.g2) || 0;
                const temPlacar = (g1 > 0 || g2 > 0 || m.status === "andamento" || m.status === "registrado");

                // Regras de Cores de Status atualizadas
                let statusClass = "";
                let statusTexto = "";

                if (!temPlacar && matchDate < agora) {
                    statusClass = "status-vermelho";
                    statusTexto = '<span style="color:var(--accent-red); font-weight:bold;">⚠️ Atrasado</span>';
                } else if (temPlacar && matchDate > agora) {
                    statusClass = "status-azul";
                    statusTexto = '<span style="color:var(--accent-blue); font-weight:bold;">⏰ Adiantado</span>';
                } else if (temPlacar || matchDate <= agora) {
                    statusClass = "status-verde";
                    statusTexto = '';
                }

                if (m.status === "atrasado") {
                    statusClass = "status-vermelho";
                    statusTexto = '<span style="color:var(--accent-red); font-weight:bold;">⚠️ Atrasado</span>';
                } else if (m.status === "adiantado") {
                    statusClass = "status-azul";
                    statusTexto = '<span style="color:var(--accent-blue); font-weight:bold;">⏰ Adiantado</span>';
                }

                cardHtml += `
                    <div class="match-item ${statusClass}">
                        <div class="match-header-info">
                            <span>🕒 ${m.horario}</span>
                            ${statusTexto}
                        </div>
                        <div class="match-teams">
                            <span class="team-name home">${p1Nome}</span>
                            
                            <div class="score-control-group">
                                <button class="btn-score" onclick="alterarPlacar(${idx}, 1, -1)">-</button>
                                <span class="score-display">${m.g1}</span>
                                <button class="btn-score" onclick="alterarPlacar(${idx}, 1, 1)">+</button>
                            </div>

                            <span style="color:var(--text-muted); font-size: 0.8rem;">×</span>

                            <div class="score-control-group">
                                <button class="btn-score" onclick="alterarPlacar(${idx}, 2, -1)">-</button>
                                <span class="score-display">${m.g2}</span>
                                <button class="btn-score" onclick="alterarPlacar(${idx}, 2, 1)">+</button>
                            </div>

                            <span class="team-name away">${p2Nome}</span>
                        </div>
                    </div>
                `;
            });

            cardHtml += `</div></div>`;
            container.innerHTML += cardHtml;
        }
    }

    carregarDados();
</script>
</body>
</html>
