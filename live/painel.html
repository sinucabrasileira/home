<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle - Placar Celular</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; display: flex; justify-content: center; }

        .container {
            width: 100%; max-width: 500px;
            background: #1e293b; padding: 15px;
            border-radius: 12px; border: 1px solid #334155;
            display: flex; flex-direction: column; gap: 12px;
        }

        h2 { text-align: center; color: #38bdf8; font-size: 16px; text-transform: uppercase; }

        .section-box {
            background: #0f172a; padding: 10px;
            border-radius: 8px; border: 1px solid #334155;
            display: flex; flex-direction: column; gap: 8px;
        }

        .row { display: flex; gap: 8px; }
        .col { flex: 1; display: flex; flex-direction: column; gap: 4px; }

        label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        input {
            background: #1e293b; border: 1px solid #475569;
            color: #fff; padding: 8px; border-radius: 4px; font-size: 14px; outline: none; width: 100%;
        }
        input:focus { border-color: #22c55e; }

        .score-control {
            display: flex; align-items: center; justify-content: space-between;
            background: #1e293b; padding: 4px 10px; border-radius: 6px; border: 1px solid #334155;
        }

        .score-num { font-size: 20px; font-weight: bold; color: #22c55e; }

        button {
            background: #2563eb; color: white; border: none;
            padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;
        }
        button:active { transform: scale(0.95); }
        .btn-minus { background: #dc2626; }
        .btn-reset { background: #475569; width: 100%; padding: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Controle Mobile</h2>

        <!-- Informações Gerais -->
        <div class="section-box">
            <label>Detalhes da Partida</label>
            <div class="row">
                <div class="col">
                    <label>Jogo</label>
                    <input type="text" id="ctrl-jogo" oninput="enviarAlteracao()">
                </div>
                <div class="col">
                    <label>Partida</label>
                    <input type="text" id="ctrl-partida" oninput="enviarAlteracao()">
                </div>
                <div class="col">
                    <label>Valor</label>
                    <input type="text" id="ctrl-valor" oninput="enviarAlteracao()">
                </div>
            </div>
        </div>

        <!-- Jogador 1 -->
        <div class="section-box">
            <label>Jogador 1</label>
            <div class="row">
                <div class="col" style="flex: 2;">
                    <input type="text" id="ctrl-p1-name" oninput="enviarAlteracao()">
                </div>
                <div class="col" style="flex: 1.5;">
                    <div class="score-control">
                        <button class="btn-minus" onclick="mudarPontos('p1', -1)">-</button>
                        <span class="score-num" id="disp-p1-score">0</span>
                        <button onclick="mudarPontos('p1', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Jogador 2 -->
        <div class="section-box">
            <label>Jogador 2</label>
            <div class="row">
                <div class="col" style="flex: 2;">
                    <input type="text" id="ctrl-p2-name" oninput="enviarAlteracao()">
                </div>
                <div class="col" style="flex: 1.5;">
                    <div class="score-control">
                        <button class="btn-minus" onclick="mudarPontos('p2', -1)">-</button>
                        <span class="score-num" id="disp-p2-score">0</span>
                        <button onclick="mudarPontos('p2', 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-reset" onclick="zerarPlacar()">Zerar Placar (0x0)</button>
    </div>

    <script>
        const socket = io();
        let estadoLocal = {};

        socket.on('atualizar_placar', (estado) => {
            estadoLocal = estado;
            // Só preenche se os inputs não estiverem em foco para não atrapalhar a digitação
            if (document.activeElement.tagName !== 'INPUT') {
                document.getElementById('ctrl-p1-name').value = estado.p1Name;
                document.getElementById('disp-p1-score').innerText = estado.p1Score;
                document.getElementById('ctrl-p2-name').value = estado.p2Name;
                document.getElementById('disp-p2-score').innerText = estado.p2Score;
                document.getElementById('ctrl-jogo').value = estado.jogo;
                document.getElementById('ctrl-partida').value = estado.partida;
                document.getElementById('ctrl-valor').value = estado.valor;
            }
        });

        function enviarAlteracao() {
            estadoLocal.p1Name = document.getElementById('ctrl-p1-name').value;
            estadoLocal.p2Name = document.getElementById('ctrl-p2-name').value;
            estadoLocal.jogo = document.getElementById('ctrl-jogo').value;
            estadoLocal.partida = document.getElementById('ctrl-partida').value;
            estadoLocal.valor = document.getElementById('ctrl-valor').value;

            socket.emit('mudar_dados', estadoLocal);
        }

        function mudarPontos(jogador, valor) {
            if (jogador === 'p1') {
                estadoLocal.p1Score = Math.max(0, estadoLocal.p1Score + valor);
            } else {
                estadoLocal.p2Score = Math.max(0, estadoLocal.p2Score + valor);
            }
            document.getElementById('disp-p1-score').innerText = estadoLocal.p1Score;
            document.getElementById('disp-p2-score').innerText = estadoLocal.p2Score;
            socket.emit('mudar_dados', estadoLocal);
        }

        function zerarPlacar() {
            if (confirm('Zerar o placar?')) {
                estadoLocal.p1Score = 0;
                estadoLocal.p2Score = 0;
                socket.emit('mudar_dados', estadoLocal);
            }
        }
    </script>
</body>
</html>
